name: MOLT CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test kernel, runtime, Observatory, and experiment tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --all-targets --locked

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile analysis tooling
        run: python -m py_compile experiments/emergence-001/analysis/*.py

      - name: Validate experiment configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('experiments/emergence-001')
          for path in root.glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          population = json.loads((root / 'population.json').read_text(encoding='utf-8'))
          agents = population['agents']
          assert len(agents) == 12
          assert len({agent['agent_id'] for agent in agents}) == 12
          freeze = json.loads((root / 'freeze.json').read_text(encoding='utf-8'))
          assert freeze['status'] == 'frozen'
          assert freeze['observatory_feedback_to_world'] is False
          print('EMERGENCE-001 configuration validated')
          PY

  package:
    name: Build and publish main-branch artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create source and binary bundle
        run: |
          mkdir -p dist
          tar --exclude='./target' --exclude='./.git' --exclude='*.tar.gz' -czf dist/molt-source.tar.gz .
          tar -czf dist/molt-release-binary.tar.gz -C target/release molt

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: molt-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
